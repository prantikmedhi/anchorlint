name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Tests (no network or live keys)
        run: python -m unittest discover -s tests -v
      - name: Lint
        run: ruff check src tests scripts
      - name: Documentation and SEO structure
        run: python scripts/check_docs.py
      - name: Build distributions
        run: python -m build
      - name: Clean wheel install and real CLI smoke
        run: |
          python -m venv /tmp/anchorlint-wheel
          /tmp/anchorlint-wheel/bin/python -m pip install dist/*.whl
          /tmp/anchorlint-wheel/bin/anchorlint --help
          /tmp/anchorlint-wheel/bin/python scripts/smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anchorlint-dist-py${{ matrix.python }}
          path: dist/
          if-no-files-found: error
