<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" role="img" aria-labelledby="title desc"><title id="title">AnchorLint decision flow</title><desc id="desc">Built HTML becomes link evidence. Local rules and optional Jev questions produce an inspectable report and CI gate.</desc><rect width="1100" height="320" rx="8" fill="#f2f3ee"/><g fill="#272c28" font-family="Helvetica,Arial,sans-serif"><text x="40" y="45" font-size="12" letter-spacing="2">CODE CHECKS. JEV JUDGES. YOU REVIEW.</text><text x="50" y="148" font-size="24">Built HTML</text><text x="50" y="178" font-size="14" fill="#61695f">Your selected files</text><text x="300" y="148" font-size="24">Link evidence</text><text x="300" y="178" font-size="14" fill="#61695f">Words · context · destination</text><text x="620" y="119" font-size="21">Local rules</text><text x="620" y="146" font-size="13" fill="#61695f">Paths and fragments</text><text x="620" y="206" font-size="21">Optional Jev</text><text x="620" y="233" font-size="13" fill="#61695f">Promise and relevance</text><text x="903" y="148" font-size="24">Report</text><text x="903" y="178" font-size="14" fill="#61695f">Evidence + CI gate</text><text x="40" y="288" font-size="12" fill="#61695f">No page edits. No generated quotations. No ranking predictions.</text></g><g fill="none" stroke="#839281" stroke-width="2"><path d="M195 157h76m-9-6 9 6-9 6M538 157h30v-37h29m-9-6 9 6-9 6M568 157v49h29m-9-6 9 6-9 6M790 120h48v37h41m-9-6 9 6-9 6M790 206h48v-49"/></g></svg>